<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Listagem de Clientes</title>
    <style>body{padding-top:1rem}</style>
</head>
<body>
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1>Clientes</h1>
        <a class="btn btn-primary" th:href="@{/cliente/cadastrar}">Novo Cliente</a>
    </div>

    <table class="table">
        <thead>
            <tr>
                <th scope="col">#</th>
                <th scope="col">Nome</th>
                <th scope="col">Data de Nascimento</th>
                <th scope="col">Profissao</th>
                <th scope="col">Ações</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="cliente : ${clientes}">
                <th scope="row" th:text="${cliente.id}">1</th>
                <td>
                    <a th:href="@{/cliente/{id}(id=${cliente.id})}" th:text="${cliente.nome}">Nome</a>
                </td>
                <td th:text="${cliente.dataNascimento}"></td>
                <td th:text="${cliente.profissao}"></td>
                <td>
                    <a class="btn btn-sm btn-outline-primary" th:href="@{/cliente/{id}/editar(id=${cliente.id})}">Editar</a>
                    <a th:href="@{/cliente/{id}/excluir(id=${cliente.id})}" class="btn btn-sm btn-outline-danger" onclick="return confirm('Deseja realmente excluir este cliente?');">Excluir</a>
                </td>
            </tr>
        </tbody>
    </table>
</div>



<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
